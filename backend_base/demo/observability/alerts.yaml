# Suggestions only: deployment owners must choose thresholds and windows.
groups:
  - name: backend-suggestions
    rules:
      - alert: BackendUnavailable
        expr: up{job="backend-base"} == 0
        for: 2m
      - alert: BackendErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.01) > 0.05
        for: 5m
      - alert: RedisAdmissionFailure
        expr: sum(rate(distributed_rate_limit_total{result="backend-failure"}[5m])) > 0
        for: 2m
