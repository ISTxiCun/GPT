spring:
  application:
    name: backend-base
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/backend_base?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:backend}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 7200
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-body: false
  is-read-header: true
  is-log: false
  is-print: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  identity:
    namespace: ${APP_NAMESPACE:${spring.application.name}}
    environment: ${APP_ENV:}
  distributed:
    lock:
      enabled: false
      watchdog-millis: 30000
    rate-limit:
      enabled: false
    submission:
      enabled: false
    cache:
      enabled: false
      ttl-millis: 300000
      null-ttl-millis: 10000
      jitter-millis: 30000
      load-wait-millis: 1000
      protect-loads: false
      fallback-on-read-failure: false
      fallback-concurrency: 8
      max-payload-bytes: 1048576
      evict-invalid: true
    # consumerName 不得以 .failed 或 .retry.<数字> 结尾。
    messaging:
      enabled: false
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      virtual-host: ${RABBITMQ_VHOST:/}
      username: ${RABBITMQ_USERNAME:}
      password: ${RABBITMQ_PASSWORD:}
      tls: false
      confirm-timeout-millis: 5000
      max-message-bytes: 1048576
      consumers-enabled: false
      prefetch: 16
      concurrency: 1
      retry-delays-millis: [1000, 10000, 60000]
      outbox:
        enabled: false
        poll-millis: 1000
        batch-size: 10
        lease-millis: 60000
        max-attempts: 10
    trusted-proxies: []
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-headers: ${CORS_ALLOWED_HEADERS:}
    exposed-headers: ${CORS_EXPOSED_HEADERS:}
    max-age-seconds: 3600
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
