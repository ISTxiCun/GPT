# docker compose -f compose.distributed-demo.yaml -f compose.observability-demo.yaml up -d
services:
  app-a:
    environment: &observability
      TRACING_ENABLED: 'true'
      TRACING_EXPORT_ENABLED: 'true'
      TRACING_SAMPLE_PROBABILITY: '1.0'
      OTLP_TRACES_ENDPOINT: http://collector:4318/v1/traces
      PROMETHEUS_ENABLED: 'true'
      MANAGEMENT_ADDRESS: 0.0.0.0
      MANAGEMENT_ENDPOINTS: health,info,prometheus
      MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: readinessState,redis
    ports: ['127.0.0.1:18081:8081']
  app-b:
    environment: *observability
    ports: ['127.0.0.1:28081:8081']
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./demo/observability/collector.yaml:/etc/otelcol/config.yaml:ro']
  jaeger:
    image: jaegertracing/all-in-one:1.68.0
    ports: ['127.0.0.1:16686:16686']
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./demo/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./demo/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ['127.0.0.1:9090:9090']
